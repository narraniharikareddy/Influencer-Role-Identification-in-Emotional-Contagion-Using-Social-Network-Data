<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Influencer Detection - Emotional Contagion</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }

    h1 {
      color: #333;
    }

    input[type="file"] {
      margin: 10px 0;
    }

    button {
      padding: 10px 15px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    .results {
      margin-top: 30px;
    }

    .influencer {
      margin-bottom: 10px;
      padding: 8px;
      background-color: #f2f2f2;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <h1>Influencer Role Identification (Emotional Contagion)</h1>

  <p>Select a CSV file with columns: <strong>source, target, message</strong></p>
  <input type="file" id="fileInput" accept=".csv" />
  <br />
  <button onclick="uploadFile()">Upload and Analyze</button>

  <div class="results" id="results"></div>

  <script>
    function uploadFile() {
      const fileInput = document.getElementById('fileInput');
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';

      if (!fileInput.files.length) {
        alert("Please select a CSV file.");
        return;
      }

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      fetch('http://localhost:8000/upload', {
        method: 'POST',
        body: formData,
      })
      .then(res => res.json())
      .then(data => {
        const influencers = data.influencers;

        if (!influencers || influencers.length === 0) {
          resultsDiv.innerHTML = "<p>No influencers found.</p>";
          return;
        }

        resultsDiv.innerHTML = "<h2>Top Influencers</h2>";
        influencers.forEach((inf, index) => {
          const div = document.createElement('div');
          div.className = 'influencer';
          div.innerText = `${index + 1}. User: ${inf.user_id} — Influence Score: ${inf.score.toFixed(4)}`;
          resultsDiv.appendChild(div);
        });
      })
      .catch(err => {
        console.error(err);
        alert("Error processing file. Make sure the backend is running.");
      });
    }
  </script>
</body>
</html>
